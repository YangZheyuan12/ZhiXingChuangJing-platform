spring:
  application:
    name: zhixingchuangjing-platform
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    password-reset:
      token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
      reset-url-base: ${PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
      sender-name: ${MAIL_SENDER_NAME:知行创境教育创作平台}
      allow-dev-reset-url: ${PASSWORD_RESET_ALLOW_DEV_URL:false}
  security:
    jwt:
      secret: change-this-secret-in-production-change-this-secret
      expiration-seconds: 7200
      refresh-expiration-seconds: 604800
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  storage:
    # 存储后端：local = 本地磁盘（默认，开箱即用）；minio = MinIO 对象存储
    mode: ${STORAGE_MODE:local}
    local:
      # 文件落盘目录（相对路径基于后端进程工作目录，建议部署时改绝对路径）
      root-dir: ${STORAGE_LOCAL_DIR:./storage}
      # 前端访问 URL 前缀，与 public-base-url 拼接
      url-prefix: ${STORAGE_LOCAL_URL_PREFIX:/files}
      # 公开基础 URL，本地开发与后端同源即可
      public-base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:zxcyj-assets}

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
